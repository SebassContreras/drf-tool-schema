[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drf-tool-schema"
version = "0.1.0"
description = "Generate function-calling tool schemas from DRF serializers. Compatible with OpenAI, Anthropic Claude, OpenRouter, Groq, Mistral, and any OpenAI-compatible LLM provider."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["django", "drf", "openai", "anthropic", "claude", "llm", "tool-calling", "function-calling", "openrouter", "groq", "mistral"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: Django",
]
dependencies = [
    "djangorestframework>=3.14",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "django>=4.2",
]

[project.urls]
Homepage = "https://github.com/SebassContreras/drf-tool-schema"
Repository = "https://github.com/SebassContreras/drf-tool-schema"
Issues = "https://github.com/SebassContreras/drf-tool-schema/issues"

[tool.hatch.build.targets.wheel]
packages = ["drf_tool_schema"]

[tool.pytest.ini_options]
testpaths = ["tests"]
